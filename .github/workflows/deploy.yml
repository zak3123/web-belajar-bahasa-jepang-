name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # Manual trigger

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build Job
  build:
    name: Build Static Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies (if any)
        run: npm install
      
      - name: Create README for deployment status
        run: |
          echo "# 🎌 Website Belajar Bahasa Jepang" > DEPLOYMENT-README.md
          echo "" >> DEPLOYMENT-README.md
          echo "**Last Updated:** $(date)" >> DEPLOYMENT-README.md
          echo "**Latest Commit:** ${{ github.sha }}" >> DEPLOYMENT-README.md
      
      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  # Deployment Job
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
